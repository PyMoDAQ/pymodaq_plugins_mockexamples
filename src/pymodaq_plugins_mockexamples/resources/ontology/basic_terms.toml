# A basic ontology for the mock instruments, in the format read by the "terms" source of pymodaq_ontology.
# The IRIs are examples (the namespace is not published): replace them by the ones of a real ontology.

[[term]]
iri = "http://example.org/mockexamples#Signal"
label = "Signal"
category = "Detection"
description = "Any signal measured by a detector."
roles = ["detector"]

[[term]]
iri = "http://example.org/mockexamples#Photodiode"
label = "Photodiode signal"
category = "Detection"
description = "Voltage delivered by a photodiode."
roles = ["detector"]

[[term]]
iri = "http://example.org/mockexamples#Temperature"
label = "Temperature"
category = "Environment"
description = "Temperature of the sample or of the setup."
roles = ["detector", "actuator"]

[[term]]
iri = "http://example.org/mockexamples#Position"
label = "Position"
category = "Control"
description = "Position of a moving stage."
roles = ["actuator"]

[[term]]
iri = "http://example.org/mockexamples#Wavelength"
label = "Wavelength"
category = "Control"
description = "Wavelength selected by a monochromator or a laser."
roles = ["actuator"]
